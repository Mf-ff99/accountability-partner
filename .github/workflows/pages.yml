name: Refresh flights and publish site

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch new flights
        if: github.event_name != 'push'
        run: python3 fetch_flights.py

      # Pushes made with GITHUB_TOKEN don't trigger another workflow run, so this can't loop.
      - name: Commit updated flights.json
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/flights.json
          git diff --cached --quiet || (git commit -m "Update flight data" && git push)

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
